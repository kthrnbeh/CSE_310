<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title appears in the browser tab. -->
    <title>Story Time with Kevin!!!</title>

    <!-- Connect this page to the CSS file for styling. -->
    <link rel="stylesheet" href="./style.css">

    <!-- Connect this page to the JavaScript file for game behavior. -->
    <script src="./script.js" defer></script>
</head>
<body>
    <!-- This div contains all of the visible story content. -->
    <div id="content">
        <!-- Main heading shown to the player. -->
        <h1>Welcome To Story Time with Kevin</h1>

        <!-- This label asks the player for their name. -->
        <label for="name-input">What is your name?</label>

        <!-- The player types their name into this input box. -->
        <input id="name-input" type="text">

        <!-- Clicking this button begins the story. -->
        <button id="start-button">Start the story!!</button>
    </div>
</body>
</html>
